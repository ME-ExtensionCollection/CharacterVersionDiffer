<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Char Differ dev harness</title>
    <link rel="icon" href="data:," />
    <style>
      /* A small subset of Marinara's dark theme tokens (packages/client/src/styles/globals.css). */
      :root {
        --background: #050312;
        --foreground: #d4d4d4;
        --card: #141414d9;
        --primary: #ec4b97;
        --secondary: #1a1a2e;
        --muted-foreground: #a1a1aa;
        --accent: #2a1a3e;
        --destructive: #ff6b9d;
        --warning: #eeaa37;
        --border: color-mix(in srgb, var(--primary) 20%, transparent);
        --radius: 0.75rem;
        color-scheme: dark;
      }
      body { margin: 0; padding: 2rem; background: var(--background); color: var(--foreground); font-family: system-ui, sans-serif; }
      main { max-width: 26rem; }
      /* Stand-ins for the Tailwind classes the real panel uses. */
      .rounded-xl { border-radius: 0.75rem; }
      .border { border: 1px solid var(--border); }
      .p-2\.5 { padding: 0.625rem; }
      .flex { display: flex; }
      .inline-flex { display: inline-flex; }
      .flex-wrap { flex-wrap: wrap; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-between { justify-content: space-between; }
      .gap-1\.5 { gap: 0.375rem; }
      .gap-2 { gap: 0.5rem; }
      .mt-2 { margin-top: 0.5rem; }
      .overflow-y-auto { overflow-y: auto; max-height: 9rem; }
      .min-w-0 { min-width: 0; }
      .flex-1 { flex: 1; }
      .row { border: 1px solid var(--border); border-radius: 0.5rem; padding: 0.375rem 0.5rem; background: var(--card); }
      .title { display: block; font-size: 0.6875rem; }
      .sub { display: block; font-size: 0.625rem; color: var(--muted-foreground); }
      .mari-editor-action { display: inline-flex; align-items: center; gap: 0.25rem; height: 1.75rem; padding: 0 0.5rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--secondary); color: var(--foreground); font-size: 0.625rem; cursor: pointer; }
      .text-left { text-align: left; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; }
      .chip { font-size: 0.625rem; padding: 0.125rem 0.5rem; border-radius: 999px; background: color-mix(in srgb, var(--primary) 15%, transparent); }
      label { display: block; margin: 1rem 0; font-size: 0.8rem; }
    </style>
    <link rel="stylesheet" href="/dev/build/extension.css" />
  </head>
  <body>
    <main>
      <h1 style="font-size: 1rem">Char Differ harness: Alice (mock editor)</h1>
      <label><input id="mock-dirty" type="checkbox" /> Editor has unsaved edits</label>
      <div id="mock-panel"></div>
    </main>
    <script src="/dev/mock-marinara.js"></script>
    <script src="/dev/build/page-runtime.js"></script>
  </body>
</html>
